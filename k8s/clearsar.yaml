apiVersion: v1
kind: Pod
metadata:
  name: clearsar
  labels:
    app: yolov9e-train
    app.kubernetes.io/name: local-storage   # REQUIRED in your cluster

spec:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoSchedule
  containers:
    - name: pytorch
      image: python:3.10-slim

      command:
        - /bin/bash
        - -c
        - |
          set -e
          pip install --no-cache-dir pillow tqdm ensemble-boxes
          python submit_test_predictions.py --5fold-only --final-conf 0.75
          while true; do sleep 3600; done

      workingDir: /workspace
      tty: true
      stdin: true

      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
          nvidia.com/mig-2g.35gb: 1   # int, not string (Kyverno require-gpu)
        limits:
          cpu: "8"
          memory: "16Gi"
          nvidia.com/mig-2g.35gb: 1

      volumeMounts:
        - name: clearsar-storage
          mountPath: /workspace

        - name: dshm
          mountPath: /dev/shm

      env:
        # Fix pip + user issues
        - name: HOME
          value: /workspace

        - name: CLEARSAR_TRAIN_CACHE
          value: "disk"

        - name: CLEARSAR_TRAIN_BATCH
          value: "2"

        - name: CLEARSAR_TRAIN_WORKERS
          value: "8"   # safer than 12

  volumes:
    - name: clearsar-storage
      hostPath:
        path: /home/dgx-s-bmu-cse-230480/clearsar   # FIXED (not full home)
        type: Directory

    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
